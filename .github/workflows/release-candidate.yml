name: Release candidate

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-candidate-main
  cancel-in-progress: true

jobs:
  artifacts:
    name: Prepare, build, and smoke-test release artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GH_TOKEN }}

      - id: version
        uses: ArchiveBox/monorepo/.github/actions/prepare-release-version@main
        with:
          package: abxbus
          branch: main
          tag-prefix: ""
          version-scheme: patch

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.6"
          enable-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: abxbus-ts/pnpm-lock.yaml

      - name: Build and smoke-test Python and npm packages
        if: steps.version.outputs.action == 'ready' || steps.version.outputs.action == 'reserved'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-artifacts/python release-artifacts/npm
          uv build --out-dir release-artifacts/python
          rm -f release-artifacts/python/.gitignore
          pnpm --dir abxbus-ts install --frozen-lockfile
          pnpm --dir abxbus-ts run build
          pnpm --dir abxbus-ts pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts/npm"
          wheel=(release-artifacts/python/abxbus-*.whl)
          npm_package=(release-artifacts/npm/abxbus-*.tgz)
          uv sync --locked --no-cache --no-sources --no-dev --no-install-project
          uv pip install --no-cache --no-deps --python .venv/bin/python "${wheel[0]}"
          smoke_dir="$(mktemp -d)"
          (cd "$smoke_dir" && VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" uv run --no-cache --active --no-project python -c 'import abxbus')
          smoke_dir="$(mktemp -d)"
          npm install --prefix "$smoke_dir" --ignore-scripts "${npm_package[0]}"
          (cd "$smoke_dir" && node --input-type=module -e 'const pkg = await import("abxbus"); if (!pkg.EventBus) throw new Error("Missing EventBus")')
          printf '%s\n' "$GITHUB_SHA" > release-artifacts/COMMIT_SHA
          (cd release-artifacts && find COMMIT_SHA python npm -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.version.outputs.action == 'ready' || steps.version.outputs.action == 'reserved'
        with:
          name: release-artifacts-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
