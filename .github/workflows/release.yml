name: Release

on:
  workflow_run:
    workflows: [Release candidate]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.owner.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: owner
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^version = "([^"]+)".*/\1/p' pyproject.toml | head -n 1)"
          TARGET="$(git ls-remote origin "refs/tags/release-candidate/$VERSION" | awk '{print $1}')"
          [[ "$TARGET" == "${{ github.event.workflow_run.head_sha }}" ]] && echo 'ready=true' >> "$GITHUB_OUTPUT" || echo 'ready=false' >> "$GITHUB_OUTPUT"

  publish:
    needs: candidate
    if: needs.candidate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      cascade_ready: ${{ steps.cascade-state.outputs.ready }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_BRANCH: main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.6"
          enable-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: abxbus-ts/pnpm-lock.yaml

      - name: Use npm with trusted publishing support
        run: npm install -g npm@12.0.1

      - name: Download exact tested release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/release-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Record verified release
        id: release
        run: |
          set -Eeuo pipefail
          VERSION="$(sed -nE 's/^version = "([^"]+)".*/\1/p' pyproject.toml | head -n 1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish tested commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: ./bin/release.sh

      - name: Confirm this tested commit owns the release tag
        id: cascade-state
        run: |
          set -Eeuo pipefail
          TARGET=""
          while read -r sha _; do
            TARGET="$sha"
          done < <(git ls-remote origin "refs/tags/${{ steps.release.outputs.version }}")
          if [[ "$TARGET" == "$RELEASE_SHA" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  cascade:
    name: Cascade verified release
    needs: publish
    if: needs.publish.outputs.cascade_ready == 'true'
    permissions:
      contents: read
    uses: ArchiveBox/monorepo/.github/workflows/cascade-release.yml@main
    with:
      upstream_package: abxbus
      upstream_version: ${{ needs.publish.outputs.version }}
    secrets:
      release_token: ${{ secrets.RELEASE_GH_TOKEN }}
